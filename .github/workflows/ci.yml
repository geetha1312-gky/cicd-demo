name: Retail Application CI/CD

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:

  build:
    name: 🔨 Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build
        run: ./mvnw clean compile


  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Run tests
        run: ./mvnw test


  package:
    name: 📦 Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Package application
        run: ./mvnw package -DskipTests


  docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/geetha1312-gky/cicd-demo:latest .

      - name: Push Docker image
        run: docker push ghcr.io/geetha1312-gky/cicd-demo:latest


  verify:
    name: 🔍 Verify
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deployment preparation check
        run: echo "Docker image successfully pushed to GHCR."

      - name: Success message
        run: echo "✅ CI pipeline completed successfully!"

