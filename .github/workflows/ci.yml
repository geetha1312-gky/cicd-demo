name: Java CI
on:
  push:
    branches:
      - master
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build
        run: ./mvnw clean compile
      - name: Test
        run: ./mvnw test
      - name: Package
        run: ./mvnw package -DskipTests
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: docker build -t ghcr.io/geetha1312-gky/cicd-demo .
      - name: Push Docker image
        run: docker push ghcr.io/geetha1312-gky/cicd-demo