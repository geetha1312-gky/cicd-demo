name: Retail Application CI/CD

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:

  build:
    name: 🔨 Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build
        run: ./mvnw clean compile


  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Run tests
        run: ./mvnw test


  package:
    name: 📦 Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Package application
        run: ./mvnw package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar


  docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/geetha1312-gky/cicd-demo:latest .

      - name: Push Docker image
        run: docker push ghcr.io/geetha1312-gky/cicd-demo:latest


  deploy:
    name: ☸️ Deploy
    runs-on: self-hosted
    needs: docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy application to Kubernetes
        run: |
          kubectl set image deployment/cicd-demo-deployment \
            cicd-demo=ghcr.io/geetha1312-gky/cicd-demo:latest

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/cicd-demo-deployment


  verify:
    name: 🔍 Verify
    runs-on: self-hosted
    needs: deploy

    steps:
      - name: Check Kubernetes deployment
        run: |
          kubectl get deployment cicd-demo-deployment
          kubectl get pods

      - name: Verify application
        run: |
          kubectl get pods -l app=cicd-demo

      - name: Success message
        run: echo "✅ CI/CD pipeline completed successfully!"
